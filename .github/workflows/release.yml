name: Release

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate skill against Agent Skills spec
        run: bash .github/scripts/validate-skill.sh jp-imperial-diet-minutes
